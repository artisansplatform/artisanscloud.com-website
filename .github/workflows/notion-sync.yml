name: Sync Notion Articles

on:
  workflow_dispatch:

concurrency:
  group: notion-sync

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="notion-sync/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git checkout -B "$BRANCH"

      - name: Run Notion sync
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Generate blog HTML
        run: node scripts/generate-blog-articles.js

      - name: Optimize blog images
        run: |
          mapfile -t images < <(find public/assets/image/blog \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) 2>/dev/null)

          if [ ${#images[@]} -gt 0 ]; then
            node scripts/optimize-images.js "${images[@]}"
          fi

      - name: Commit changes
        id: commit
        run: |
          # Stage only the sync outputs that exist. The sync does not always
          # create blog/ or assets/image/blog/ (e.g. no new articles, or no
          # article images), and those dirs are not tracked when empty, so a
          # bare "git add blog/" would fail the pathspec under bash -e.
          for path in blog assets/data/local-articles.json public/assets/image/blog; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new articles to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-verify -m "chore: sync articles from Notion"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push --set-upstream origin "$BRANCH"

      - name: Create Pull Request
        id: create-pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: sync articles from Notion ($(date +%Y-%m-%d))" \
            --body "Manual sync of published articles from Notion." \
            --base main \
            --head "$BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Log sync history to Notion
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HISTORY_DATABASE_ID: ${{ secrets.NOTION_HISTORY_DATABASE_ID }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: node scripts/log-notion-history.js