name: Sync Notion Articles

on:
  push:
    branches:
      - claude/happy-bell-3vv2y6

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Generate blog HTML
        run: node scripts/generate-blog-articles.js

      - name: Optimize blog images
        run: |
          mapfile -t images < <(find assets/image/blog/ \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) 2>/dev/null)
          if [ ${#images[@]} -gt 0 ]; then
            node scripts/optimize-images.js "${images[@]}"
          fi

      - name: Create branch, open PR, and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="notion-sync/$(date +%Y-%m-%d)"

          git fetch origin main
          # Put the new branch on top of origin/main WITHOUT touching the
          # worktree. A "git checkout ... origin/main" aborts here because the
          # sync modified tracked files that differ on main (e.g.
          # assets/data/local-articles.json), and a dirty-index checkout would
          # also drag .github/workflows/notion-sync.yml into the commit, which
          # the GITHUB_TOKEN is not allowed to push. Instead: create the branch
          # at the current commit (no worktree change), then "reset --mixed" the
          # index to origin/main. reset --mixed never touches the worktree, so it
          # cannot abort and keeps the generated files in place. The index is now
          # a clean origin/main baseline, so only the paths we explicitly stage
          # below can ever land in the commit (never the workflow file).
          git checkout -B "$BRANCH"
          git reset --mixed origin/main

          for path in blog/ assets/data/local-articles.json assets/image/blog/; do
            [ -e "$path" ] && git add "$path"
          done

          if git diff --staged --quiet; then
            echo "No new articles to sync. Skipping."
            exit 0
          fi

          # --no-verify skips the image-size pre-commit hook; optimization already ran above
          git commit --no-verify -m "chore: sync articles from Notion"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync articles from Notion ($(date +%Y-%m-%d))" \
            --body "Automated daily sync of published articles from Notion." \
            --base main \
            --head "$BRANCH"