name: Sync Notion Articles

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="notion-sync/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          # Testing on the feature branch: base the sync branch on the commit
          # that triggered this run (already checked out), so the sync scripts
          # are present. Switch back to main before merging this to main.
          git checkout -B "$BRANCH"

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Generate blog HTML
        run: node scripts/generate-blog-articles.js

      - name: Optimize blog images
        run: |
          mapfile -t images < <(find assets/image/blog \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) 2>/dev/null)

          if [ ${#images[@]} -gt 0 ]; then
            node scripts/optimize-images.js "${images[@]}"
          fi

      - name: Commit changes
        id: commit
        run: |
          # Stage only the sync outputs that exist. The sync does not always
          # create blog/ or assets/image/blog/ (e.g. no new articles, or no
          # article images), and those dirs are not tracked when empty, so a
          # bare "git add blog/" would fail the pathspec under bash -e.
          for path in blog assets/data/local-articles.json assets/image/blog; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new articles to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-verify -m "chore: sync articles from Notion"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push --set-upstream origin "$BRANCH"

      - name: Create Pull Request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: sync articles from Notion ($(date +%Y-%m-%d))" \
            --body "Automated daily sync of published articles from Notion." \
            --base ${{ github.ref_name }} \
            --head "$BRANCH"
