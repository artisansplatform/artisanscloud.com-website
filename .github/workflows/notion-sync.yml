name: Sync Notion Articles

on:
  push:
    branches:
      - claude/happy-bell-3vv2y6

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Generate blog HTML
        run: node scripts/generate-blog-articles.js

      - name: Create branch, open PR, and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add blog/ assets/data/local-articles.json assets/image/blog/

          if git diff --staged --quiet; then
            echo "No new articles to sync. Skipping."
            exit 0
          fi

          BRANCH="notion-sync/$(date +%Y-%m-%d)"

          git checkout -b "$BRANCH"
          git commit -m "chore: sync articles from Notion"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync articles from Notion ($(date +%Y-%m-%d))" \
            --body "Automated daily sync of published articles from Notion." \
            --base main \
            --head "$BRANCH"

          gh pr merge "$BRANCH" --merge --auto