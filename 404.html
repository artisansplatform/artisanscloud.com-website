<!doctype html>
<html lang="en">
  <head>
    {{> head-meta}}
    <style>
      @keyframes cloudMove {
        0% {
          transform: translateX(0vw);
        }
        100% {
          transform: translateX(-110vw);
        }
      }
    </style>
  </head>
  <body>
    <div class="p-5 h-full">
      <div
        class="relative h-[calc(100vh_-_40px)] overflow-hidden rounded-3xl md:rounded-[30px] bg-[url(../../assets/image/artisanscloud-404-error-bg.png)] bg-cover bg-bottom bg-no-repeat"
      >
        <div
          class="max-w-[1240px] w-full px-4 xl:px-0 mx-auto relative z-10 h-full"
        >
          <div class="flex flex-col h-full justify-between pb-20">
            <div>
              <img
                src="assets/image/artisanscloud-404-image.png"
                alt="404 Error - Page Not Found"
                width="269"
                height="302"
                class="h-44 md:h-auto mx-auto mb-5 md:mb-7"
              />
              <div class="text-center lg:max-w-[540px] mx-auto">
                <h1
                  class="mb-5 lg:text-[50px] md:text-5xl text-3xl text-heading font-primary font-semibold"
                >
                  Page Not Found
                </h1>
                <p
                  class="text-lg lg:text-xl text-description font-primary font-normal leading-[150%]"
                >
                  The page you’re looking for doesn’t exist or has been moved.
                  Please check the URL or return to the homepage.
                </p>
                <a
                  href="/index"
                  class="mx-auto lg:mt-10 sm:mt-8 mt-6 w-fit h-fit rounded-[40px] sm:px-6 px-4 sm:py-4 py-3 flex items-center justify-center text-center gap-2.5 font-primary font-semibold text-sm md:text-base leading-[100%] relative overflow-hidden transition-all duration-300 ease-in-out active:bg-primary active:text-white active:scale-95 focus-visible:bg-primary focus-visible:text-white bg-primary text-white hover:bg-primary-light"
                  >Go Back</a
                >
              </div>
            </div>
            <div class="text-center mt-20">
              <a
                href="#"
                class="text-base font-semibold font-primary underline text-heading"
                >Contact Support</a
              >
            </div>
          </div>
        </div>

        <img
          src="assets/image/icon/cloud-2.svg"
          alt=""
          width="67"
          height="18"
          loading="lazy"
          class="absolute top-[10%] left-[20%] animate-[cloudMove_40s_linear_infinite] select-none pointer-events-none"
        />
